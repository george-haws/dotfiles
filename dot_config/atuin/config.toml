# Local history only. Sync is off on purpose: work commands stay on the
# work machine. fzf keeps Ctrl-T and Alt-C; atuin owns Ctrl-R.
auto_sync = false
update_check = false
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
style = "compact"
inline_height = 20
enter_accept = false
